[project]
name = "scraper"
version = "0.1.0"
description = ""
authors = [
    {name = "Robson Lachat",email = "robson.neves@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "selenium (>=4.43.0,<5.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "webdriver-manager (>=4.0.2,<5.0.0)",
    "playwright (>=1.58.0,<2.0.0)",
    "mistralai (>=2.4.0,<3.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "langchain-mistralai (>=1.1.2,<2.0.0)",
    "langchain (>=1.2.15,<2.0.0)",
    "playwright-stealth (>=2.0.3,<3.0.0)",
    "scrapegraphai (>=1.76.0,<2.0.0)",
    "crawl4ai (>=0.8.6,<0.9.0)",
    "ollama (>=0.6.2,<0.7.0)",
    "google-genai (>=2.6.0,<3.0.0)",
    "google-generativeai (>=0.8.6,<0.9.0)"
]

[tool.poetry]
packages = [{include = "scraper", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
